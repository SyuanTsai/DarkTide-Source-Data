name: W01 source preview CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/SYP-311-w01]
permissions:
  contents: read
jobs:
  source-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Source contract tests
        run: npm test
      - name: Build isolated fixture preview and capture its receipt
        run: npm run --silent content:preview > "$RUNNER_TEMP/w01-source-receipt.json"
      - name: Build pending real-claim preview and capture its receipt
        run: node scripts/content/build.mjs --mode preview --input w01-real-claim-candidate.json > "$RUNNER_TEMP/w01-source-real-claim-receipt.json"
      - name: Build pending representative preview and capture its receipt
        run: node scripts/content/build.mjs --mode preview --input w01-real-representative-candidate.json > "$RUNNER_TEMP/w01-source-representative-receipt.json"
      - name: Verify fixture and pending-candidate receipts and write run summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          function readVerifiedReceipt(filename) {
            const receiptPath = path.join(process.env.RUNNER_TEMP, filename);
            const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
            const outputPath = path.join(process.cwd(), receipt.outputDirectory);
            const storedReceipt = JSON.parse(fs.readFileSync(path.join(outputPath, 'receipt.json'), 'utf8'));
            if (JSON.stringify(storedReceipt) !== JSON.stringify(receipt)) throw new Error(filename + ': stored receipt differs from CLI receipt');
            return { receipt, outputPath };
          }

          const fixture = readVerifiedReceipt('w01-source-receipt.json');
          if (fixture.receipt.previewOnly !== true || fixture.receipt.fixtureOnly !== true || fixture.receipt.publicationEligible !== false) {
            throw new Error('W01 CI requires a fixture-only, ineligible preview receipt');
          }
          if (fixture.receipt.sourceRevision !== '94d2e7767bf60d56793a6b9a910376c975fef3439afe5931fbb03d763913ef4b' ||
              fixture.receipt.manifestSha256 !== '27a06a383ab06ab0d15720bd2b0a3e0e8e905755679665a32988ca704c80acb6') {
            throw new Error('W01 default fixture revision changed unexpectedly');
          }
          const candidate = readVerifiedReceipt('w01-source-real-claim-receipt.json');
          if (candidate.receipt.previewOnly !== true || candidate.receipt.fixtureOnly !== false || candidate.receipt.publicationEligible !== false) {
            throw new Error('W01 CI requires a non-fixture, pending, ineligible candidate preview receipt');
          }
          const technical = JSON.parse(fs.readFileSync(path.join(candidate.outputPath, 'technical.json'), 'utf8'));
          if (technical.fixtureOnly !== false || technical.publicationEligible !== false || technical.records.length !== 4 ||
              technical.records.some(record => record.reviewState !== 'pending') || technical.gameChanges.length !== 0) {
            throw new Error('W01 CI candidate must contain four pending records and no game changes');
          }
          if (candidate.receipt.sourceRevision !== '2a2e9b3f731358c01fb103bde759bf03be726e3e15aa0b623821d8c717d68c11' ||
              candidate.receipt.manifestSha256 !== '86f617d2ec13cdd905641e7d7230fd1b2d650be6243e2ffde9ad756f57cc6307') {
            throw new Error('W01 four-record candidate revision changed unexpectedly');
          }
          for (const filename of ['analysis.md', 'game-changes.md']) {
            const markdown = fs.readFileSync(path.join(candidate.outputPath, filename), 'utf8');
            if (!markdown.startsWith('> **Pending review:** not approved for publication.\n\n') || markdown.includes('synthetic contract output')) {
              throw new Error(filename + ': pending real candidate banner is incorrect');
            }
          }
          const representative = readVerifiedReceipt('w01-source-representative-receipt.json');
          if (representative.receipt.previewOnly !== true || representative.receipt.fixtureOnly !== false || representative.receipt.publicationEligible !== false) {
            throw new Error('W01 CI requires a non-fixture, pending, ineligible representative preview receipt');
          }
          const representativeTechnical = JSON.parse(fs.readFileSync(path.join(representative.outputPath, 'technical.json'), 'utf8'));
          if (representativeTechnical.fixtureOnly !== false || representativeTechnical.publicationEligible !== false ||
              representativeTechnical.records.length !== 13 || representativeTechnical.records.some(record => record.reviewState !== 'pending') ||
              representativeTechnical.gameChanges.length !== 0) {
            throw new Error('W01 representative candidate must contain thirteen pending records and no game changes');
          }
          const byId = new Map(representativeTechnical.records.map(record => [record.recordId, record]));
          const variant = byId.get('darktide:blessing-variant:chainaxe:p1-movement-speed-on-activation');
          if (!variant || JSON.stringify(variant.payload.definedTiers) !== JSON.stringify([1, 2, 3, 4]) ||
              JSON.stringify(variant.payload.tierValues.map(item => item.value.decimal)) !== JSON.stringify(['0.17', '0.18', '0.19', '0.2']) ||
              variant.payload.obtainableTiers.status !== 'unknown' || variant.payload.obtainableTiers.reasonCode !== 'NOT_VERIFIED') {
            throw new Error('W01 representative blessing tiers do not match the pending raw-code candidate');
          }
          const duration = byId.get('darktide:claim:chainaxe:p1-movement-speed-on-activation-duration');
          if (!duration || duration.payload.property !== 'template.buff_override.active_duration' ||
              duration.payload.value.status !== 'known' || duration.payload.value.decimal !== '2' || duration.payload.value.unit !== 's' ||
              duration.payload.basis !== 'code-observed' || duration.reviewState !== 'pending') {
            throw new Error('W01 representative duration must remain a pending code-observed template literal');
          }
          const rawAttack = byId.get('darktide:stat-curve:chainaxe-p1-m1-default-light-attack-power-table');
          const rawArmor = byId.get('darktide:stat-curve:chainaxe-p1-m1-default-light-armored-parameter-table');
          if (!rawAttack || JSON.stringify(rawAttack.payload.knots) !== JSON.stringify([{ x: '1', y: '80' }, { x: '2', y: '140' }]) ||
              !rawArmor || JSON.stringify(rawArmor.payload.knots) !== JSON.stringify([{ x: '1', y: '1.035' }, { x: '2', y: '1.965' }]) ||
              rawAttack.payload.interpolation.status !== 'unknown' || rawArmor.payload.interpolation.status !== 'unknown') {
            throw new Error('W01 representative raw parameter tables must remain ordered and uninterpolated');
          }
          for (const filename of ['analysis.md', 'game-changes.md']) {
            const markdown = fs.readFileSync(path.join(representative.outputPath, filename), 'utf8');
            if (!markdown.startsWith('> **Pending review:** not approved for publication.\n\n') || markdown.includes('synthetic contract output')) {
              throw new Error(filename + ': pending representative candidate banner is incorrect');
            }
          }
          const summary = [
            '## W01 source previews',
            '',
            '- Candidate status: non-fixture, pending, publication-ineligible.',
            '- Candidate source revision: ' + candidate.receipt.sourceRevision,
            '- Candidate manifest SHA-256: ' + candidate.receipt.manifestSha256,
            '- Candidate output: ' + candidate.receipt.outputDirectory,
            '- Review scope: docs/w01-real-claim-review.md',
            '',
            '- Representative status: non-fixture, pending, publication-ineligible.',
            '- Representative source revision: ' + representative.receipt.sourceRevision,
            '- Representative manifest SHA-256: ' + representative.receipt.manifestSha256,
            '- Representative output: ' + representative.receipt.outputDirectory,
            '- Review scope: docs/w01-real-claim-review.md',
            '',
            '- Existing fixture status: fixture-only, pending, publication-ineligible.',
            '- Fixture source revision: ' + fixture.receipt.sourceRevision,
            '- Fixture manifest SHA-256: ' + fixture.receipt.manifestSha256,
            '- Fixture output: ' + fixture.receipt.outputDirectory,
            '',
            'This run validates two public-code-backed pending candidates and a synthetic fixture. It does not approve the claims or publish a formal release.',
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Upload safe generated Source preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syp-311-w01-source-preview
          path: |
            dist-w01/source/*/analysis.md
            dist-w01/source/*/game-changes.json
            dist-w01/source/*/game-changes.md
            dist-w01/source/*/receipt.json
            dist-w01/source/*/source-manifest.json
            dist-w01/source/*/technical.json
          if-no-files-found: error
          retention-days: 7
