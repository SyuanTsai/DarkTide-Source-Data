name: W09 Source release handoff
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/content/contract-*.mjs'
  workflow_dispatch:
    inputs:
      release_id:
        description: Derived W09 release ID from a verified formal Source request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: w09-source-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  source-validation:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out Source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Source contract tests
        run: npm test
      - name: Build W01 previews for review
        run: |
          npm run --silent content:preview > /dev/null
          node scripts/content/build.mjs --mode preview --input w01-real-claim-candidate.json > /dev/null
          node scripts/content/build.mjs --mode preview --input w01-real-representative-candidate.json > /dev/null
      - name: Upload safe generated Source preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syp-311-w01-source-preview
          path: |
            dist-w01/source/*/analysis.md
            dist-w01/source/*/game-changes.json
            dist-w01/source/*/game-changes.md
            dist-w01/source/*/receipt.json
            dist-w01/source/*/source-manifest.json
            dist-w01/source/*/technical.json
          if-no-files-found: error
          retention-days: 7
      - name: Detect changes that can affect the W09 request
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(content/|scripts/|package\.json$|\.github/workflows/shared-source-handoff\.yml$)'; then
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare=false" >> "$GITHUB_OUTPUT"
            echo "No content, script, or handoff workflow change; skipped the W09 candidate request." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare a pending candidate request for review
        if: steps.scope.outputs.prepare == 'true'
        run: node scripts/content/contract-w09-request.mjs --prepare --source-root "$GITHUB_WORKSPACE" --output-root "$RUNNER_TEMP/w09-source-handoff" --mode candidate --input-preset splitW07
      - name: Upload the request and packet for workflow diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w09-source-handoff-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/w09-source-handoff/packets/*/*
            ${{ runner.temp }}/w09-source-handoff/requests/*.json
          if-no-files-found: ignore
          retention-days: 7
  formal-handoff:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out Source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run Source contract tests
        run: npm test
      - name: Publish or reuse the immutable Source archive, then dispatch only its release ID
        env:
          SOURCE_EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_ARCHIVE_TOKEN: ${{ github.token }}
          WEB_HANDOFF_TOKEN: ${{ secrets.WEB_HANDOFF_TOKEN }}
        run: |
          if [ "$SOURCE_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/content/contract-w09-request.mjs --prepare --source-root "$GITHUB_WORKSPACE" --output-root "$RUNNER_TEMP/w09-source-handoff" --mode formal --input-preset splitW07 --fallback-candidate --publish-archive --dispatch --release-id "$REQUESTED_RELEASE_ID"
          else
            node scripts/content/contract-w09-request.mjs --prepare --source-root "$GITHUB_WORKSPACE" --output-root "$RUNNER_TEMP/w09-source-handoff" --mode formal --input-preset splitW07 --fallback-candidate --publish-archive --dispatch --all-releases --skip-published
          fi
      - name: Upload the request and packet for workflow diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w09-formal-handoff-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/w09-source-handoff/packets/*/*
            ${{ runner.temp }}/w09-source-handoff/requests/*.json
          if-no-files-found: ignore
          retention-days: 7
